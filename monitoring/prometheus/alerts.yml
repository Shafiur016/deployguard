groups:
- name: deployguard
  rules:
  - alert: DeployGuardServiceDown
    expr: up{job="deployguard-api"} == 0
    for: 1m
    labels: {severity: critical}
    annotations:
      summary: 'DeployGuard API scrape is failing'
  - alert: DeployGuardNotReady
    expr: deployguard_ready{job="deployguard-api"} == 0
    for: 1m
    labels: {severity: warning}
    annotations:
      summary: 'DeployGuard API readiness check is failing'
  - alert: DeployGuardHighErrorRate
    expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
    for: 2m
    labels: {severity: warning}
    annotations:
      summary: '5xx error ratio exceeds 5%'
